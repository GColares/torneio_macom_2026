<script>
let compModalInstanceUnificado = null;

async function openComprovanteModal(comprovanteId) {
    if (!compModalInstanceUnificado) {
        compModalInstanceUnificado = new bootstrap.Modal(document.getElementById('modalEdicaoComprovante'));
    }
    
    // Fetch data
    try {
        const res = await fetch(`/api/comprovantes/${comprovanteId}/`);
        const data = await res.json();
        if (data.success) {
            const c = data.comprovante;
            const url = c.arquivo_url;
            
            // Set elements
            const docViewer = document.getElementById('docViewer');
            const imgViewer = document.getElementById('imgViewer');
            const docPlaceholder = document.getElementById('docPlaceholder');
            const pathDisplay = document.getElementById('editCompPathDisplay');
            
            if (url) {
                pathDisplay.innerText = decodeURIComponent(url);
                docPlaceholder.classList.add('d-none');
                document.getElementById('virtualReceiptComprovante').classList.add('d-none');
                document.getElementById('btnPrintVirtual').classList.add('d-none');
                if (url.toLowerCase().endsWith('.pdf')) {
                    docViewer.src = url + '#toolbar=0';
                    docViewer.style.display = 'block';
                    imgViewer.style.display = 'none';
                } else {
                    docViewer.style.display = 'none';
                    imgViewer.src = url;
                    imgViewer.style.display = 'block';
                }
            } else {
                pathDisplay.innerText = 'Recibo Virtual Sistêmico';
                docViewer.style.display = 'none';
                imgViewer.style.display = 'none';
                docPlaceholder.classList.add('d-none');
                
                // Exibe Recibo Virtual
                document.getElementById('virtualReceiptComprovante').classList.remove('d-none');
                document.getElementById('btnPrintVirtual').classList.remove('d-none');
                
                // Popula dados do Recibo Virtual
                document.getElementById('vrPagador').innerText = c.pagador || 'NÃO INFORMADO';
                document.getElementById('vrValor').innerText = c.valor || '60.00';
                document.getElementById('vrDupla').innerText = c.dupla_numero || c.dupla_id || 'N/A';
                document.getElementById('vrJ1').innerText = c.dupla_j1 || '-';
                document.getElementById('vrJ2').innerText = c.dupla_j2 || '-';
                
                if (c.data_hora) {
                    const dt = new Date(c.data_hora);
                    document.getElementById('vrData').innerText = dt.toLocaleString('pt-BR');
                } else {
                    document.getElementById('vrData').innerText = 'Data não informada';
                }
            }
            
            // Populate form
            document.getElementById('editCompId').value = c.id;
            document.getElementById('editCompValor').value = c.valor;
            document.getElementById('editCompBanco').value = c.banco;
            document.getElementById('editCompPagador').value = c.pagador;
            document.getElementById('editCompIdentificador').value = c.identificador;
            document.getElementById('editCompData').value = c.data_hora;
            
            // Vinculo
            if (c.dupla_id) {
                document.getElementById('displayNumDupla').innerText = c.dupla_numero || c.dupla_id;
                document.getElementById('displayJ1').innerText = c.dupla_j1;
                document.getElementById('displayJ2').innerText = c.dupla_j2 || 'Sem parceiro';
                document.getElementById('vinculoAtualBox').style.display = 'block';
                document.getElementById('editCompDupla').value = c.dupla_id;
                
                // Show status
                document.getElementById('statusDuplaContainer').style.display = 'block';
                document.getElementById('editCompStatusPagamento').value = c.status_pagamento;
                document.getElementById('editCompStatusInscricao').value = c.status_inscricao;
            } else {
                document.getElementById('vinculoAtualBox').style.display = 'none';
                document.getElementById('editCompDupla').value = '';
                document.getElementById('statusDuplaContainer').style.display = 'none';
            }
            
            compModalInstanceUnificado.show();
        } else {
            alert('Erro ao carregar comprovante: ' + data.error);
        }
    } catch (e) {
        alert('Erro de rede: ' + e);
    }
}

async function salvarEdicaoComprovanteUnificado() {
    var rawDupla = document.getElementById('editCompDupla').value || '';
    var duplaId = rawDupla.split(' - ')[0].trim();
    if (isNaN(parseInt(duplaId))) duplaId = '';
    
    var payload = {
        id: document.getElementById('editCompId').value,
        dupla_id: duplaId,
        valor: document.getElementById('editCompValor').value,
        banco: document.getElementById('editCompBanco').value,
        pagador: document.getElementById('editCompPagador').value,
        identificador: document.getElementById('editCompIdentificador').value,
        data_hora: document.getElementById('editCompData').value,
    };
    
    if (document.getElementById('statusDuplaContainer').style.display !== 'none') {
        payload.status_pagamento = document.getElementById('editCompStatusPagamento').value;
        payload.status_inscricao = document.getElementById('editCompStatusInscricao').value;
    }
    
    try {
        const res = await fetch('/api/comprovantes/update/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
            location.reload();
        } else {
            alert('Erro: ' + data.message);
        }
    } catch (e) {
        alert('Erro na comunicação: ' + e);
    }
}

function imprimirReciboVirtual() {
    var prtContent = document.getElementById("virtualReceiptComprovante").innerHTML;
    var WinPrint = window.open('', '', 'left=0,top=0,width=800,height=900,toolbar=0,scrollbars=0,status=0');
    WinPrint.document.write('<html><head><title>Imprimir Recibo</title>');
    WinPrint.document.write('<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">');
    WinPrint.document.write('<style>body { background: white; padding: 20px; color: black !important; } .border-dark { border-color: #000 !important; } .text-muted { color: #6c757d !important; }</style>');
    WinPrint.document.write('</head><body>');
    WinPrint.document.write(prtContent);
    WinPrint.document.write('</body></html>');
    WinPrint.document.close();
    WinPrint.focus();
    setTimeout(function() {
        WinPrint.print();
        WinPrint.close();
    }, 500);
}

// Live Preview (Two-Way Data Binding)
document.addEventListener('DOMContentLoaded', function() {
    const editPagador = document.getElementById('editCompPagador');
    const editValor = document.getElementById('editCompValor');
    const editData = document.getElementById('editCompData');
    const editDupla = document.getElementById('editCompDupla');

    if (editPagador) {
        editPagador.addEventListener('input', function() {
            document.getElementById('vrPagador').innerText = this.value || 'NÃO INFORMADO';
        });
    }

    if (editValor) {
        editValor.addEventListener('input', function() {
            document.getElementById('vrValor').innerText = this.value || '60.00';
        });
    }

    if (editData) {
        editData.addEventListener('input', function() {
            if (this.value) {
                const dt = new Date(this.value);
                document.getElementById('vrData').innerText = dt.toLocaleString('pt-BR');
            } else {
                document.getElementById('vrData').innerText = 'Data não informada';
            }
        });
    }

    if (editDupla) {
        editDupla.addEventListener('input', function() {
            const rawVal = this.value || '';
            const parts = rawVal.split(' - ');
            const num = parts[0].trim();
            document.getElementById('vrDupla').innerText = num || 'N/A';

            if (parts.length > 1) {
                const nomes = parts[1].split('&');
                document.getElementById('vrJ1').innerText = nomes[0] ? nomes[0].trim() : '-';
                document.getElementById('vrJ2').innerText = nomes[1] ? nomes[1].trim() : '-';
            } else {
                document.getElementById('vrJ1').innerText = '-';
                document.getElementById('vrJ2').innerText = '-';
            }
        });
    }
});
</script>
