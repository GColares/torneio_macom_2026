{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneio Maçônico - Telão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-primary: #c9d1d9;
            --text-bright: #ffffff;
            --free-color: #238636;
            --free-bg: rgba(35, 134, 54, 0.15);
            --free-border: #2ea043;
            --busy-color: #da3633;
            --busy-bg: rgba(218, 54, 51, 0.15);
            --busy-border: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .header-telao {
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header-telao h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-bright);
            margin: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .mesas-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colunas fixas para bater com o mapa do salão */
            gap: 20px;
            margin-bottom: 40px;
            direction: rtl; /* Inverte a ordem do Grid (Direita pra Esquerda) */
        }
        .mesa-card {
            height: 200px; /* Altura fixa compacta */
            background-color: var(--panel-bg);
            border: 3px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            overflow: hidden;
            direction: ltr; /* Devolve a leitura normal ao texto do Card */
        }
        .mesa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }
        .mesa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .mesa-id {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-bright);
        }
        .mesa-arbitro {
            font-size: 1rem;
            color: #8b949e;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        /* Status: Livre */
        .mesa-livre {
            border-color: var(--free-border);
            background-color: var(--free-bg);
        }
        .mesa-livre .mesa-id { color: #3fb950; }
        .status-badge-livre {
            display: inline-block;
            background-color: var(--free-color);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: auto;
            animation: pulse-green 2s infinite;
        }
        
        /* Status: Ocupada */
        .mesa-ocupada {
            border-color: var(--busy-border);
            background-color: var(--busy-bg);
        }
        .mesa-ocupada .mesa-id { color: #ff7b72; }
        .duplas-confronto {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dupla-nome {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vs-badge {
            margin: 5px 0;
            font-size: 1.2rem;
            font-weight: 900;
            color: #ff7b72;
            font-style: italic;
        }
        .timer {
            margin-top: 15px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #d2a8ff;
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 5px;
            transition: color 0.5s;
        }
        .timer.estourado {
            color: #ff0000;
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); color: #ff5555; }
            100% { transform: scale(1); }
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 160, 67, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 160, 67, 0); }
        }

        /* Leaderboard and Fila layout for lower half */
        .bottom-panels {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .panel h2 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-bright);
            margin-bottom: 20px;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }
        
        .nav-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>

    <a href="{% url 'index' %}" class="btn btn-outline-secondary nav-voltar"><i class="fa-solid fa-arrow-left"></i> Painel Admin</a>

    <div class="header-telao text-center mb-4 mt-3">
        <h1><i class="fa-solid fa-trophy text-warning"></i> Mapa do Salão - Confrontos</h1>
    </div>

    <div class="container-fluid px-4">
        <div class="row g-4">
            
            <!-- ESQUERDA: Mesas (10 colunas) -->
            <div class="col-lg-10">
                <div class="mesas-grid" id="gridMesas">
                    <!-- Renderizado dinamicamente via JS -->
                </div>
            </div>

            <!-- DIREITA: Lateral (Fila e Rankings, 2 colunas) -->
            <div class="col-lg-2">
                <!-- Fila de Espera -->
                <div class="panel mb-4" style="background-color: var(--panel-bg); border-radius: 12px; padding: 20px;">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-list-ol text-info"></i> Próximos da Fila</h5>
                    <ul class="list-group list-group-flush bg-transparent border-0" id="listaFila">
                        <!-- Renderizado via JS -->
                        <li class="list-group-item bg-transparent text-light border-secondary px-0">Ninguém na fila.</li>
                    </ul>
                </div>

                <!-- Leaderboard TOP 5 -->
                <div class="panel" style="background-color: var(--panel-bg); border-radius: 12px; padding: 20px; position: sticky; top: 20px;">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-simple text-warning"></i> TOP 5</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped text-center align-middle" id="tabelaRanking">
                            <thead>
                                <tr style="color: #8b949e; font-size: 0.7rem;">
                                    <th>POS</th>
                                    <th class="text-start">DUPLA</th>
                                    <th>PTS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Renderizado via JS -->
                                <tr><td colspan="3" class="text-center text-muted">Aguardando resultados...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Iniciar Jogo -->
    <div class="modal fade" id="modalNovaPartida" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--panel-bg); color: var(--text-bright);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-success"><i class="fa-solid fa-play"></i> Iniciar Confronto - <span id="lblMesaLivre"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="iniciarMesaId">
                    <div class="mb-3">
                        <label class="form-label text-light">Selecione a Dupla A:</label>
                        <select id="selectDuplaA" class="form-select bg-dark text-light border-secondary">
                        </select>
                    </div>
                    <div class="mb-3 text-center fs-4 fw-bold text-danger font-italic">VS</div>
                    <div class="mb-3">
                        <label class="form-label text-light">Selecione a Dupla B:</label>
                        <select id="selectDuplaB" class="form-select bg-dark text-light border-secondary">
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success fw-bold" onclick="submitIniciarJogo()">Começar Jogo <i class="fa-solid fa-check"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Encerrar Jogo -->
    <div class="modal fade" id="modalEncerrarPartida" tabindex="-1" aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: var(--panel-bg); color: var(--text-bright);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-stop"></i> Pagar Súmula - <span id="lblMesaOcupada"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <input type="hidden" id="encerrarConfrontoId">
                    <p class="mb-4 text-warning">Digite a pontuação final (PF) de cada dupla ditada pelo árbitro.</p>
                    

                    <div class="row g-3 align-items-center mb-3">
                        <div class="col-8 text-end fs-5 fw-bold" id="lblDuplaA">Dupla A</div>
                        <div class="col-4">
                            <input type="number" id="pontosA" class="form-control bg-dark text-light border-secondary text-center fs-4" placeholder="0" min="0">
                        </div>
                        <div class="col-12 text-end">
                            <div class="form-check form-switch d-inline-block">
                                <input class="form-check-input" type="checkbox" id="gatoA">
                                <label class="form-check-label text-danger small fw-bold" for="gatoA">GATO (Dupla A)</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row g-3 align-items-center mb-3">
                        <div class="col-8 text-end fs-5 fw-bold" id="lblDuplaB">Dupla B</div>
                        <div class="col-4">
                            <input type="number" id="pontosB" class="form-control bg-dark text-light border-secondary text-center fs-4" placeholder="0" min="0">
                        </div>
                        <div class="col-12 text-end">
                            <div class="form-check form-switch d-inline-block">
                                <input class="form-check-input" type="checkbox" id="gatoB">
                                <label class="form-check-label text-danger small fw-bold" for="gatoB">GATO (Dupla B)</label>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger fw-bold" onclick="submitEncerrarJogo()">Encerrar e Salvar <i class="fa-solid fa-save"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>


        let allDuplas = [];
        let activeTimers = {}; // { confrontoId: isoString }


        // Loop para atualizar os cronometros segundo a segundo (Regressivo 15 min)
        setInterval(() => {
            const now = new Date();
            document.querySelectorAll('.timer[data-inicio]').forEach(el => {
                const inicio = new Date(el.getAttribute('data-inicio'));
                const diffMs = now - inicio;
                const totalSecondsPassed = Math.floor(diffMs / 1000);
                
                const timeLimitSeconds = 15 * 60; // 15 minutos
                let remainingSeconds = timeLimitSeconds - totalSecondsPassed;
                
                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    el.classList.add('estourado');
                } else {
                    el.classList.remove('estourado');
                }
                
                const min = Math.floor(remainingSeconds / 60);
                const seg = remainingSeconds % 60;
                
                el.innerHTML = `<i class="fa-regular fa-clock"></i> ${min.toString().padStart(2, '0')}:${seg.toString().padStart(2, '0')}`;
            });
        }, 1000);

        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/torneio/state/');
                const data = await response.json();
                
                allDuplas = data.duplas || [];

                const grid = document.getElementById('gridMesas');
                grid.innerHTML = '';
                
                data.mesas.forEach(m => {
                    if (m.ocupada) {
                        // Passando nomes escapados
                        const da = m.confronto.dupla_a.replace(/'/g, "");
                        const db = m.confronto.dupla_b.replace(/'/g, "");
                        grid.innerHTML += `
                            <div class="mesa-card mesa-ocupada" onclick="abrirModalEncerrarPartida(${m.numero}, ${m.confronto.id}, '${da}', '${db}')">
                                <div class="mesa-header">
                                    <span class="mesa-id">MESA ${m.numero.toString().padStart(2, '0')}</span>
                                    <span class="mesa-arbitro"><i class="fa-solid fa-gavel"></i> ${m.arbitro}</span>
                                </div>
                                <div class="duplas-confronto">
                                    <div class="dupla-nome">${m.confronto.dupla_a}</div>
                                    <div class="vs-badge">VS</div>
                                    <div class="dupla-nome">${m.confronto.dupla_b}</div>
                                </div>
                                <div class="timer" data-inicio="${m.confronto.inicio}"><i class="fa-regular fa-clock"></i> 00:00</div>
                            </div>
                        `;
                    } else {

                        grid.innerHTML += `
                            <div class="mesa-card mesa-livre" onclick="abrirModalNovaPartida(${m.id}, ${m.numero})">
                                <div class="mesa-header">
                                    <span class="mesa-id">MESA ${m.numero.toString().padStart(2, '0')}</span>
                                    <span class="mesa-arbitro"><i class="fa-solid fa-gavel"></i> ${m.arbitro}</span>
                                </div>
                                <div class="status-badge-livre">LIVRE</div>
                                <div class="timer text-muted"><i class="fa-regular fa-clock"></i> 15:00</div>
                            </div>
                        `;
                    }
                });
                
                // Preencher Ranking
                const tbRanking = document.querySelector('#tabelaRanking tbody');
                tbRanking.innerHTML = '';
                if(data.leaderboard && data.leaderboard.length > 0) {
                    data.leaderboard.forEach(r => {
                        tbRanking.innerHTML += `
                            <tr>
                                <td class="fw-bold text-light">${r.rank}º</td>
                                <td class="text-start text-light">${r.dupla} <small class="text-secondary ms-1">(${r.vitorias}V, S: ${r.saldo})</small></td>
                                <td class="fw-bold text-warning fs-5">${r.pontos}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbRanking.innerHTML = '<tr><td colspan="3" class="text-muted">Sem resultados</td></tr>';
                }
                
            } catch (err) {
                console.error('Erro ao buscar dados do Telão:', err);
            }
        }

        let modalNovaInst = null;
        function abrirModalNovaPartida(mesaId, numero) {
            document.getElementById('lblMesaLivre').innerText = "Mesa " + numero;
            document.getElementById('iniciarMesaId').value = mesaId;
            
            const selA = document.getElementById('selectDuplaA');
            const selB = document.getElementById('selectDuplaB');
            selA.innerHTML = '<option value="">-- Selecione --</option>';
            selB.innerHTML = '<option value="">-- Selecione --</option>';
            
            allDuplas.forEach(d => {
                selA.innerHTML += `<option value="${d.id}">${d.label}</option>`;
                selB.innerHTML += `<option value="${d.id}">${d.label}</option>`;
            });

            if (!modalNovaInst) modalNovaInst = new bootstrap.Modal(document.getElementById('modalNovaPartida'));
            modalNovaInst.show();
        }
        
        async function submitIniciarJogo() {
            const mesa_id = document.getElementById('iniciarMesaId').value;
            const dupla_a_id = document.getElementById('selectDuplaA').value;
            const dupla_b_id = document.getElementById('selectDuplaB').value;
            if(!dupla_a_id || !dupla_b_id) return alert("Selecione ambas as duplas!");
            if(dupla_a_id === dupla_b_id) return alert("As duplas devem ser diferentes!");

            const resp = await fetch('/api/torneio/iniciar/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mesa_id, dupla_a_id, dupla_b_id})
            });
            const result = await resp.json();
            if(result.success) {
                modalNovaInst.hide();
                fetchDashboardData();
            } else {
                alert(result.message);
            }
        }

        let modalEncerrarInst = null;
        function abrirModalEncerrarPartida(numero, confrontoId, duplaA, duplaB) {
            document.getElementById('lblMesaOcupada').innerText = "Mesa " + numero;
            document.getElementById('encerrarConfrontoId').value = confrontoId;
            document.getElementById('lblDuplaA').innerText = duplaA;
            document.getElementById('lblDuplaB').innerText = duplaB;
            document.getElementById('pontosA').value = '';
            document.getElementById('pontosB').value = '';
            document.getElementById('gatoA').checked = false;
            document.getElementById('gatoB').checked = false;

            if (!modalEncerrarInst) modalEncerrarInst = new bootstrap.Modal(document.getElementById('modalEncerrarPartida'));
            modalEncerrarInst.show();
        }

        async function submitEncerrarJogo() {
            const confronto_id = document.getElementById('encerrarConfrontoId').value;
            const pontos_a = document.getElementById('pontosA').value;
            const pontos_b = document.getElementById('pontosB').value;
            const gato_a = document.getElementById('gatoA').checked;
            const gato_b = document.getElementById('gatoB').checked;
            
            if(pontos_a === '' || pontos_b === '') return alert("Preencha a pontuação de ambas!");

            const resp = await fetch('/api/torneio/encerrar/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({confronto_id, pontos_a, pontos_b, gato_a, gato_b})
            });
            const result = await resp.json();
            if(result.success) {
                modalEncerrarInst.hide();
                fetchDashboardData();
            } else {
                alert(result.message);
            }
        }

        
        // Loop de auto-refresh a cada 5 segundos
        setInterval(fetchDashboardData, 5000);
        // Chamada inicial
        fetchDashboardData();
    </script>
</body>
</html>
