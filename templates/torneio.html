{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneio Maçônico - Telão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-primary: #c9d1d9;
            --text-bright: #ffffff;
            --free-color: #238636;
            --free-bg: rgba(35, 134, 54, 0.15);
            --free-border: #2ea043;
            --busy-color: #da3633;
            --busy-bg: rgba(218, 54, 51, 0.15);
            --busy-border: #f85149;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .header-telao {
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header-telao h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-bright);
            margin: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .mesas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .mesa-card {
            background-color: var(--panel-bg);
            border: 3px solid #30363d;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .mesa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }
        .mesa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .mesa-id {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-bright);
        }
        .mesa-arbitro {
            font-size: 1rem;
            color: #8b949e;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        /* Status: Livre */
        .mesa-livre {
            border-color: var(--free-border);
            background-color: var(--free-bg);
        }
        .mesa-livre .mesa-id { color: #3fb950; }
        .status-badge-livre {
            display: inline-block;
            background-color: var(--free-color);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: auto;
            animation: pulse-green 2s infinite;
        }
        
        /* Status: Ocupada */
        .mesa-ocupada {
            border-color: var(--busy-border);
            background-color: var(--busy-bg);
        }
        .mesa-ocupada .mesa-id { color: #ff7b72; }
        .duplas-confronto {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dupla-nome {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vs-badge {
            margin: 5px 0;
            font-size: 1.2rem;
            font-weight: 900;
            color: #ff7b72;
            font-style: italic;
        }
        .timer {
            margin-top: 15px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #d2a8ff;
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 5px;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46, 160, 67, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 160, 67, 0); }
        }

        /* Leaderboard and Fila layout for lower half */
        .bottom-panels {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .panel h2 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-bright);
            margin-bottom: 20px;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }
        
        .nav-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>

    <a href="{% url 'index' %}" class="btn btn-outline-secondary nav-voltar"><i class="fa-solid fa-arrow-left"></i> Painel Admin</a>

    <div class="header-telao">
        <h1><i class="fa-solid fa-trophy text-warning"></i> Mapa do Salão - Confrontos</h1>
    </div>

    <!-- MAPA DE MESAS -->
    <div class="mesas-grid" id="gridMesas">
        <!-- Renderizado dinamicamente via JS -->
    </div>

    <!-- FILA E LEADERBOARD -->
    <div class="bottom-panels">
        <!-- Fila de Espera -->
        <div class="panel">
            <h2><i class="fa-solid fa-list-ol text-info"></i> Próximos da Fila</h2>
            <ul class="list-group list-group-flush" style="font-size: 1.2rem; font-weight: 600;">
                <li class="list-group-item bg-transparent text-light border-secondary">1º - Dupla 08</li>
                <li class="list-group-item bg-transparent text-light border-secondary">2º - Dupla 12</li>
                <li class="list-group-item bg-transparent text-light border-secondary">3º - Dupla 33</li>
            </ul>
        </div>

        <!-- Leaderboard TOP 5 -->
        <div class="panel">
            <h2><i class="fa-solid fa-ranking-star text-warning"></i> TOP 5 Classificação</h2>
            <table class="table table-dark table-striped text-center align-middle" style="font-size: 1.2rem;">
                <thead>
                    <tr>
                        <th>POS</th>
                        <th class="text-start">DUPLA</th>
                        <th>PTS</th>
                        <th>VITÓRIAS</th>
                        <th>SALDO (PF-PS)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><i class="fa-solid fa-medal text-warning fs-3"></i></td>
                        <td class="text-start fw-bold">Dupla 10</td>
                        <td class="fw-bold text-success">45</td>
                        <td>12</td>
                        <td>+400</td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-medal text-secondary fs-4"></i></td>
                        <td class="text-start fw-bold">Dupla 02</td>
                        <td class="fw-bold text-success">38</td>
                        <td>10</td>
                        <td>+350</td>
                    </tr>
                    <tr>
                        <td><i class="fa-solid fa-medal" style="color: #cd7f32; font-size: 1.2rem;"></i></td>
                        <td class="text-start fw-bold">Dupla 21</td>
                        <td class="fw-bold text-success">33</td>
                        <td>9</td>
                        <td>+120</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/torneio/state/');
                const data = await response.json();
                
                const grid = document.getElementById('gridMesas');
                grid.innerHTML = ''; // Limpa antes de renderizar
                
                data.mesas.forEach(m => {
                    if (m.ocupada) {
                        grid.innerHTML += `
                            <div class="mesa-card mesa-ocupada" onclick="abrirModalEncerrarPartida(${m.id}, ${m.confronto.id})">
                                <div class="mesa-header">
                                    <span class="mesa-id">MESA ${m.numero.toString().padStart(2, '0')}</span>
                                    <span class="mesa-arbitro"><i class="fa-solid fa-gavel"></i> ${m.arbitro}</span>
                                </div>
                                <div class="duplas-confronto">
                                    <div class="dupla-nome">${m.confronto.dupla_a}</div>
                                    <div class="vs-badge">VS</div>
                                    <div class="dupla-nome">${m.confronto.dupla_b}</div>
                                </div>
                                <div class="timer"><i class="fa-regular fa-clock"></i> Em Andamento</div>
                            </div>
                        `;
                    } else {
                        grid.innerHTML += `
                            <div class="mesa-card mesa-livre" onclick="abrirModalNovaPartida(${m.id})">
                                <div class="mesa-header">
                                    <span class="mesa-id">MESA ${m.numero.toString().padStart(2, '0')}</span>
                                    <span class="mesa-arbitro"><i class="fa-solid fa-gavel"></i> ${m.arbitro}</span>
                                </div>
                                <div class="status-badge-livre">LIVRE</div>
                            </div>
                        `;
                    }
                });
                
            } catch (err) {
                console.error('Erro ao buscar dados do Telão:', err);
            }
        }

        function abrirModalNovaPartida(mesaId) {
            console.log("Abrir modal para alocar duplas na Mesa " + mesaId);
            // Implementação futura
        }
        
        function abrirModalEncerrarPartida(mesaId, confrontoId) {
            console.log("Abrir modal para encerrar o confronto " + confrontoId + " na Mesa " + mesaId);
            // Implementação futura
        }
        
        // Loop de auto-refresh a cada 5 segundos
        setInterval(fetchDashboardData, 5000);
        // Chamada inicial
        fetchDashboardData();
    </script>
</body>
</html>
